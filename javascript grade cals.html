
<!DOCTYPE html>
<html>
<head>
    <title>Grade Calculator</title>
</head>
<body>
    <h2>Student Grade Calculator</h2>

    <form onsubmit="calculateGrade(event)">
        <label>Subject 1:</label>
        <input type="number" id="s1" min="0" max="100" required><br><br>

        <label>Subject 2:</label>
        <input type="number" id="s2" min="0" max="100" required><br><br>

        <label>Subject 3:</label>
        <input type="number" id="s3" min="0" max="100" required><br><br>

        <label>Subject 4:</label>
        <input type="number" id="s4" min="0" max="100" required><br><br>

        <label>Subject 5:</label>
        <input type="number" id="s5" min="0" max="100" required><br><br>

        <button type="submit">Calculate Grade</button>
    </form>

    <p id="result"></p>

    <script>
        function calculateGrade(event) {
            event.preventDefault();

            let total = 0;

            for (let i = 1; i <= 5; i++) {
                let mark = Number(document.getElementById("s" + i).value);

                if (mark < 0 || mark > 100) {
                    alert("Enter marks between 0 and 100");
                    return;
                }

                total += mark;
            }

            let average = total / 5;
            let grade;

            if (average >= 90)
                grade = "A+";
            else if (average >= 80)
                grade = "A";
            else if (average >= 70)
                grade = "B";
            else if (average >= 60)
                grade = "C";
            else if (average >= 50)
                grade = "D";
            else
                grade = "F";

            document.getElementById("result").innerHTML =
                "Total Marks: " + total + "/500<br>" +
                "Average: " + average.toFixed(2) + "%<br>" +
                "Grade: " + grade;
        }
    </script>
</body>
</html>
